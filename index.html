<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>St Martin's School Attendance</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  background: #f5f5f7;
  margin: 0;
  padding: 12px;
}

/* Header */
.header {
  background: #0b1a3a; /* Navy */
  color: white;
  border-radius: 16px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px #ddd;
}
.header h2 {
  margin: 0;
  font-size: 18px;
}
.header img {
  height: 40px;
  margin-right: 10px;
}
.header button {
  width: 40px;
  height: 36px;
  border-radius: 10px;
  border: none;
  background: #c5221f; /* Red */
  color: white;
  font-size: 20px;
  font-weight: 900;
}

/* Student Card */
.student {
  background: white;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 1px 3px #ddd;
}
.nameRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.name {
  font-weight: 800;
  font-size: 16px;
}
.badge {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  background: #ffd700; /* Gold */
  color: #0b1a3a;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 12px;
}
.dayHead {
  text-align: center;
  font-size: 12px;
  color: #666;
}

/* Buttons */
.dayBtn {
  padding: 10px 2px;
  border-radius: 12px;
  border: 2px solid transparent;
  font-weight: 800;
  background: #e0e0e0;
  color: #333;
}

/* Present */
.dayBtn[data-status="Present"] {
  background: #e6f4ea;
  color: #137333;
  border-color: #137333;
}

/* Absent */
.dayBtn[data-status="Absent"] {
  background: #fce8e6;
  color: #c5221f;
  border-color: #c5221f;
}

/* Late */
.dayBtn[data-status="Late"] {
  background: #fef7e0;
  color: #e37400;
  border-color: #e37400;
}

/* Authorised Absence */
.dayBtn[data-status="Authorised Absence"] {
  background: #e3f2fd;
  color: #0b63c5;
  border-color: #0b63c5;
}

/* Actions */
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.btn {
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-weight: 700;
}
.btn-save {
  background: #137333;
  color: white;
  grid-column: span 2;
}
.btn-clear {
  background: white;
  box-shadow: 0 1px 3px #ddd;
}
</style>
</head>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
<body>

<div class="header">
  <button onclick="changeMonth(-1)">&#10094;</button>
  <h2 id="title">St Martin's School – Attendance</h2>
  <button onclick="changeMonth(1)">&#10095;</button>
</div>

<div id="students"></div>

<div class="actions">
  <button class="btn btn-save" onclick="save()">Save</button>
  <button class="btn btn-clear" onclick="clearWeek()">Clear Week</button>
  <button class="btn btn-clear" onclick="clearMonth()">Clear Month</button>
</div>

<script>
/* -------------------------
   Data Model
------------------------- */

const names = ["Sam Jones", "Rhys Jones", "Florian Dirr", "Rohan Sharma"];
let cur = new Date();

// store[name][date] = "Present" | "Absent" | "Late" | "Authorised Absence"
let store = JSON.parse(localStorage.getItem("attendanceStore") || "{}");

function ensureStudent(name) {
  if (!store[name]) store[name] = {};
}

/* -------------------------
   Helpers
------------------------- */

function getDays(y, m) {
  const days = [];
  let d = new Date(y, m, 1);
  while (d.getMonth() === m) {
    if (d.getDay() !== 0 && d.getDay() !== 6) {
      days.push(new Date(d));
    }
    d.setDate(d.getDate() + 1);
  }
  return days;
}

function changeMonth(n) {
  cur.setMonth(cur.getMonth() + n);
  render();
}

function cycleStatus(status) {
  return status === "Present" ? "Absent" :
         status === "Absent" ? "Late" :
         status === "Late" ? "Authorised Absence" :
         "Present";
}

/* -------------------------
   Rendering
------------------------- */

function render() {
  const y = cur.getFullYear();
  const m = cur.getMonth();
  const days = getDays(y, m);

  document.getElementById("title").innerText =
    `St Martin's School – ${cur.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}`;

  const wrap = document.getElementById("students");
  wrap.innerHTML = "";

  names.forEach(name => {
    ensureStudent(name);

    let score = 0;
    days.forEach(d => {
      const iso = d.toISOString().split("T")[0];
      const status = store[name][iso] || "Present";

      if (status === "Present") score += 1;
      else if (status === "Late") score += 0.5;
      // Authorised Absence gives 0 but does NOT penalise
    });

    const pct = Math.round((score / days.length) * 100);

    const div = document.createElement("div");
    div.className = "student";

    let html = `
      <div class="nameRow">
        <span class="name">${name}</span>
        <span class="badge">${pct}% this month</span>
      </div>
      <div class="grid">
        ${["Mon","Tue","Wed","Thu","Fri"].map(d => `<div class="dayHead">${d}</div>`).join("")}
      </div>
      <div class="grid">
    `;

    days.forEach(d => {
      const iso = d.toISOString().split("T")[0];
      const status = store[name][iso] || "Present";

      html += `
        <button class="dayBtn"
          data-name="${name}"
          data-date="${iso}"
          data-status="${status}"
          onclick="toggle(this)">
          <div>${d.getDate()}</div>
          <div>${status[0]}</div>
        </button>
      `;
    });

    html += `</div>`;
    div.innerHTML = html;
    wrap.appendChild(div);
  });
}

/* -------------------------
   Interaction
------------------------- */

function toggle(btn) {
  const name = btn.dataset.name;
  const date = btn.dataset.date;
  const current = btn.dataset.status;

  const next = cycleStatus(current);
  btn.dataset.status = next;
  store[name][date] = next;

  btn.innerHTML = `<div>${date.split("-")[2]}</div><div>${next[0]}</div>`;
  btn.className = "dayBtn";
  btn.setAttribute("data-status", next);
}

function save() {
  localStorage.setItem("attendanceStore", JSON.stringify(store));
  render();
}

function clearWeek() {
  if (!confirm("Clear Mon–Fri this week?")) return;

  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  monday.setHours(0,0,0,0);

  const friday = new Date(monday);
  friday.setDate(friday.getDate() + 4);
  friday.setHours(23,59,59);

  names.forEach(name => {
    ensureStudent(name);
    Object.keys(store[name]).forEach(date => {
      const d = new Date(date);
      if (d >= monday && d <= friday) delete store[name][date];
    });
  });

  save();
}

function clearMonth() {
  if (!confirm("Clear this month?")) return;

  const y = cur.getFullYear();
  const m = cur.getMonth();

  names.forEach(name => {
    ensureStudent(name);
    Object.keys(store[name]).forEach(date => {
      const d = new Date(date);
      if (d.getMonth() === m && d.getFullYear() === y) {
        delete store[name][date];
      }
    });
  });

  save();
}

render();
</script>

</body>
</html>
